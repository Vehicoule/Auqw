[package]
name = "auqw-conformance-echo"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Conformance guest that returns done with the step input as result"

[lib]
crate-type = ["cdylib", "rlib"]

# Guests need `unsafe` for the ABI pointer handoff; the workspace forbids
# unsafe_code, so this crate declares its own lints instead of inheriting.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
