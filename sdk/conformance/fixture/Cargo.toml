[package]
name = "auqw-conformance-fixture"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Conformance fixture guest — canned catalog/playback/lyrics/radio results for desktop evidence runs"

[lib]
crate-type = ["cdylib", "rlib"]

# Guests need `unsafe` for the ABI pointer handoff (inside the
# export_plugin! expansion); the workspace forbids unsafe_code, so this
# crate declares its own lints instead of inheriting.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
auqw-guest-sdk = { path = "../../rust" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
