name: release

# A `v*` tag is the release. The tag carries the full semver
# (v0.0.1-alpha.1, v0.0.1) — tooling/stamp-version.mjs writes it into
# the release-facing manifests before any build runs, so artifacts
# always identify their own tag and the repo manifests just track the
# in-development line.
on:
  push:
    tags: ['v*']

# read is all the build jobs need — write stays scoped to the publish
# job below so a compromised build step can't rewrite the repo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # A tag used to publish straight from untested builds — gate on
  # ci.yml's real check surface by calling it as a reusable workflow
  # instead of copying its steps here, so CI and the release gate
  # can't drift apart and a new CI check gates the next tag for free.
  gate:
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: [gate]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      # All-or-nothing publish: `needs: [desktop, android]` gates the
      # release job on the whole matrix, so one failed platform blocks
      # the release until fixed — a partial asset set is never a
      # release. fail-fast stays default: the first failure cancels
      # the other legs rather than paying for dead builds.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # windows-latest defaults `run:` steps to pwsh — the build
        # scripts are bash, and Git Bash is on the runner image.
        shell: bash
    steps:
      # providers.lock.json resolves `release:../auqw-plugins/...` —
      # the plugins repo must sit as a sibling of the Auqw checkout.
      - uses: actions/checkout@v7
        with:
          path: auqw
      - uses: actions/checkout@v7
        with:
          repository: Vehicoule/Auqw-plugins
          path: auqw-plugins
          # Same-org public repos read fine under GITHUB_TOKEN; a
          # private plugins repo needs a PAT in PLUGINS_CHECKOUT_TOKEN.
          token: ${{ secrets.PLUGINS_CHECKOUT_TOKEN || github.token }}
      # Git for Windows checks out text files CRLF — sync-plugins then
      # hashes manifest bytes that no longer match provenance. Both
      # repos carry `* text=auto eol=lf` .gitattributes (this one,
      # and Auqw-plugins#5), which pins LF checkouts on every platform
      # without a renormalize step.
      # Pinned rustup over a toolchain action — one less node-runtime
      # dep, identical result.
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: auqw
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: auqw/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: auqw/pnpm-lock.yaml
      # electron-builder downloads the Electron dist + packaging tools
      # on every build — cache the per-OS cache dirs (linux ~/.cache,
      # mac ~/Library/Caches, win ~/AppData/Local/*/Cache).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('auqw/pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      # The flathub runtime/SDK/BaseApp install is GBs each run — the
      # flatpak user repo + builder cache survive in these two dirs. The
      # key rotates weekly: restore-keys pulls last week's snapshot, the
      # post-install `flatpak update` refreshes refs, and the new key
      # persists the refreshed snapshot — a fixed key would restore the
      # first saved state forever.
      - id: flatpak-period
        if: runner.os == 'Linux'
        run: echo "period=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: runner.os == 'Linux'
        with:
          path: |
            ~/.local/share/flatpak
            ~/.flatpak-builder
          key: flatpak-24.08-${{ runner.os }}-${{ steps.flatpak-period.outputs.period }}
          restore-keys: flatpak-24.08-${{ runner.os }}-
      - name: flatpak toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform/x86_64/24.08 \
            org.freedesktop.Sdk/x86_64/24.08 \
            org.electronjs.Electron2.BaseApp/x86_64/24.08
          # The cache key rotates weekly and restore-keys pulls last
          # week's snapshot, so a warm restore can hold stale runtime
          # refs — this refreshes them before the build relies on them.
          flatpak update --user -y
      - name: build desktop packages
        working-directory: auqw
        run: |
          pnpm install --frozen-lockfile
          node tooling/stamp-version.mjs "$VERSION"
          node tooling/stamp-version.mjs --check "${VERSION#v}"
          node tooling/sync-plugins.mjs apps/desktop/plugins
          pnpm --dir apps/desktop run dist
      # sha256sum is not on the macOS runner image — the node tool
      # emits the same `<hex>  <name>` format the publish job verifies
      # with sha256sum -c. Per-OS names: three dirs × one release would
      # otherwise collide on a single SHA256SUMS.txt asset.
      - name: checksums
        working-directory: auqw/apps/desktop/dist-packages
        run: |
          # A target renamed outside auqw-* drops out of both this
          # checksums glob and the upload globs without erroring
          # anywhere — assert the expected bundles landed before
          # hashing, so a packaging change fails here instead of
          # shipping a silently thin release.
          case "${{ runner.os }}" in
            Linux) expected=("auqw-*.AppImage" "auqw-*.flatpak") ;;
            macOS) expected=("auqw-*.dmg") ;;
            Windows) expected=("auqw-*-setup.exe") ;;
          esac
          found=$(ls auqw-* 2>/dev/null | tr '\n' ' ')
          for pattern in "${expected[@]}"; do
            if ! ls $pattern >/dev/null 2>&1; then
              echo "::error::missing $pattern — expected [${expected[*]}], found [${found:-nothing}]"
              exit 1
            fi
          done
          node ../../../tooling/checksums.mjs . "SHA256SUMS-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-packages-${{ runner.os }}
          # auqw-* globs only the shipped files — dist-packages also
          # holds electron-builder's unpacked/ staging dir, which is
          # not a release asset (and `gh release` fails on dirs).
          # .blockmap files are electron-updater differential-update
          # internals — no updater ships in alpha, so they're excluded.
          path: |
            auqw/apps/desktop/dist-packages/auqw-*
            auqw/apps/desktop/dist-packages/SHA256SUMS*
            !auqw/apps/desktop/dist-packages/*.blockmap

  android:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: auqw
      - uses: actions/checkout@v7
        with:
          repository: Vehicoule/Auqw-plugins
          path: auqw-plugins
          token: ${{ secrets.PLUGINS_CHECKOUT_TOKEN || github.token }}
      - run: |
          rustup toolchain install 1.98.0 --profile minimal \
            --target aarch64-linux-android --target x86_64-linux-android
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: auqw
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: auqw/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: auqw/pnpm-lock.yaml
      # Prebuilt cargo-ndk — `cargo install` compiles it from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # Caches gradle deps + wrapper downloads between runs.
      - uses: gradle/actions/setup-gradle@v6
      # Alpha signing key lives in repo secrets — decoded to a runner
      # temp file, never committed. A release must never silently ship
      # debug-signed: missing secrets fail the job (the plugin's no-env
      # debug fallback is for local builds only). Only the keystore
      # *path* enters shared env — passwords stay step-scoped so later
      # build scripts can't read them.
      - name: alpha signing key
        env:
          AUQW_ALPHA_KEYSTORE_B64: ${{ secrets.AUQW_ALPHA_KEYSTORE_B64 }}
          AUQW_ALPHA_STORE_PASSWORD: ${{ secrets.AUQW_ALPHA_STORE_PASSWORD }}
          AUQW_ALPHA_KEY_PASSWORD: ${{ secrets.AUQW_ALPHA_KEY_PASSWORD }}
        run: |
          if [ -z "$AUQW_ALPHA_KEYSTORE_B64" ] || \
             [ -z "$AUQW_ALPHA_STORE_PASSWORD" ] || \
             [ -z "$AUQW_ALPHA_KEY_PASSWORD" ]; then
            echo '::error::AUQW_ALPHA_* secrets missing — refusing to publish a debug-signed release APK' >&2
            exit 1
          fi
          echo "$AUQW_ALPHA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/alpha.keystore"
          echo "AUQW_ALPHA_KEYSTORE_FILE=$RUNNER_TEMP/alpha.keystore" >> "$GITHUB_ENV"
      - name: android inputs (bindings + plugins)
        working-directory: auqw
        run: |
          # ubuntu-latest ships several NDKs under the SDK — the
          # bindings script defaults to a macOS path, so point it at
          # the highest installed here.
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          ./tooling/build-android-bindings.sh
          pnpm install --frozen-lockfile
          node tooling/stamp-version.mjs "$VERSION"
          node tooling/stamp-version.mjs --check "${VERSION#v}"
          node tooling/sync-plugins.mjs
          pnpm --dir apps/mobile exec expo prebuild --platform android
      - name: build release APK
        working-directory: auqw/apps/mobile
        # Passwords only here — step-scoped so the bindings/plugin steps
        # above never see them. assembleRelease embeds the JS bundle —
        # the APK is standalone (a debug APK is a dev client that needs
        # Metro on the device).
        env:
          AUQW_ALPHA_STORE_PASSWORD: ${{ secrets.AUQW_ALPHA_STORE_PASSWORD }}
          AUQW_ALPHA_KEY_PASSWORD: ${{ secrets.AUQW_ALPHA_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease -Pauqw.abis=arm64-v8a
          cd .. && for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            name=$(basename "$apk")
            abi=${name#app-}; abi=${abi%-release.apk}
            mv "$apk" "auqw-${VERSION#v}-android-${abi}.apk"
          done
          ls -la auqw-*-android-*.apk
      - name: checksums
        working-directory: auqw/apps/mobile
        run: |
          # Same silent-drop guard as desktop: if the rename loop
          # matched nothing, the checksums and upload globs both come
          # up empty without any error.
          expected=("auqw-*-android-*.apk")
          found=$(ls auqw-* 2>/dev/null | tr '\n' ' ')
          for pattern in "${expected[@]}"; do
            if ! ls $pattern >/dev/null 2>&1; then
              echo "::error::missing $pattern — expected [${expected[*]}], found [${found:-nothing}]"
              exit 1
            fi
          done
          # The sums file takes the platform name, not runner.os —
          # this job runs on ubuntu and runner.os would collide with
          # the desktop Linux sums asset on the release.
          node ../../tooling/checksums.mjs . SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android-packages
          path: |
            auqw/apps/mobile/auqw-*-android-*.apk
            auqw/apps/mobile/SHA256SUMS*

  release:
    needs: [desktop, android]
    # the only job that mutates anything — gh writes the release and
    # its assets with this token, so it alone scopes up to write.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job — gh resolves the repo from GH_REPO,
          # not the (absent) working tree.
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          # A `-` in the tag marks a prerelease channel (alpha/beta/rc);
          # bare v*.*.* publishes stable.
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          # Verify every bundle before any of it goes public — each
          # package dir ships its own sums file (SHA256SUMS-<os>.txt,
          # SHA256SUMS-Android.txt), itself an asset. The glob is
          # `*-packages*` not `*-packages-*`: the android-packages dir
          # name has no trailing segment to match.
          for d in artifacts/*-packages*/; do
            (cd "$d" && sha256sum -c SHA256SUMS*)
          done
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            # First-run create lands as a DRAFT — the shared tail
            # below uploads the assets and flips it live, so a
            # mid-upload failure never ships a public release
            # carrying a partial asset set.
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --draft \
              "${flags[@]}"
          fi
          # Never delete the release: a failed attempt must leave
          # existing downloads serving. Assets refresh in place
          # (bounded retries shrink the per-asset clobber window);
          # obsolete names prune only after uploads succeed; notes
          # regenerate since the tag may have moved.
          for attempt in 1 2 3; do
            if gh release upload "$VERSION" --clobber \
              artifacts/desktop-packages-*/* \
              artifacts/android-packages/*; then break; fi
            [ "$attempt" -lt 3 ] || exit 1
          done
          mapfile -t names < <(basename -a artifacts/desktop-packages-*/* artifacts/android-packages/*)
          # Prune in the main shell, not as the tail of a `gh | while`
          # pipeline: that loop runs in a subshell where a delete
          # failure can surface as a zero pipeline status and the step
          # stays green — a stale asset keeps serving with no signal.
          # mapfile the asset list first, then a plain loop whose
          # delete-asset failures errexit sees directly.
          mapfile -t old_assets < <(gh release view "$VERSION" --json assets -q '.assets[].name')
          for old in "${old_assets[@]}"; do
            case " ${names[*]} " in
              *" $old "*) ;;
              *) gh release delete-asset "$VERSION" "$old" --yes ;;
            esac
          done
          notes=$(gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$VERSION" -q .body)
          gh release edit "$VERSION" --notes "$notes"
          # The tag's channel is enforced on every run — a release
          # created out-of-band (e.g. a hand-made draft) must not
          # publish with the wrong channel: an alpha tag stays
          # prerelease and never 'Latest', a stable tag clears it.
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --prerelease --latest=false
          else
            gh release edit "$VERSION" --prerelease=false
          fi
          # A leftover draft publishes only now — after every asset and
          # note update succeeded — so a failed retry never ships a
          # half-populated release.
          draft=$(gh release view "$VERSION" --json isDraft -q .isDraft)
          if [ "$draft" = "true" ]; then
            gh release edit "$VERSION" --draft=false
          fi
