name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow as the tag publish gate — same
  # checks, no second copy to keep in sync.
  workflow_call:

# checkout + caches + typecheck only — nothing here writes to the repo.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The desktop binding's artifact name and module loading are
  # platform-shaped — the smoke runs on all three target OSes.
  node-bindings:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build -p auqw-node-bindings
      - run: node crates/node-bindings/test/smoke.mjs

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # tooling/ is not a workspace package, so `pnpm -r test` never
      # reaches it — the versionCode monotonicity tests have to be
      # called out or a colliding derivation ships unnoticed.
      - run: node --test 'tooling/**/*.test.mjs'
