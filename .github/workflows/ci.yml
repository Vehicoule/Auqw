name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow as the tag publish gate — same
  # checks, no second copy to keep in sync.
  workflow_call:

# checkout + caches + typecheck only — nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same ref makes in-flight runs moot — cancel
# them rather than letting stale runs queue behind fresh ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Nextest runs every test binary (and the tests inside them) in
      # parallel — `cargo test` serializes binaries, which left the
      # two ~40s suites stacked end to end.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      # --locked pins resolution to the committed Cargo.lock — without
      # it every CI build can silently re-resolve within semver.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked
      # Nextest does not run doctests — they are their own step.
      - run: cargo test --locked --doc

  # The desktop binding's artifact name and module loading are
  # platform-shaped — the smoke runs on all three target OSes.
  node-bindings:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: cargo build --locked -p auqw-node-bindings
      - run: node crates/node-bindings/test/smoke.mjs

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # tooling/ is not a workspace package, so `pnpm -r test` never
      # reaches it — the versionCode monotonicity tests have to be
      # called out or a colliding derivation ships unnoticed.
      - run: node --test 'tooling/**/*.test.mjs'

  # providers.lock.json is the root of the plugin artifact trust
  # chain — the pinned key + digests are the only reason a guest is
  # trusted — but until now only release.yml and the cache warmer ever
  # read it, so a drifted or tampered pin merged green. This job gives
  # the lock a merge gate: --check verifies every entry against the
  # sibling plugins checkout (release dir resolves, digests match
  # provenance, signature verifies under the pinned key) without
  # staging or copying anything, and --release refuses a local-build
  # dev source ever landing in the lock.
  plugin-lock:
    runs-on: ubuntu-latest
    steps:
      # Same sibling layout as release.yml — the lock resolves
      # `release:../auqw-plugins/...`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: auqw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Vehicoule/Auqw-plugins
          path: auqw-plugins
          token: ${{ secrets.PLUGINS_CHECKOUT_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node tooling/sync-plugins.mjs --check --release
        working-directory: auqw
