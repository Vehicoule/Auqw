packages:
  - "apps/*"
  - "modules/*"
  - "packages/*"
# Expo/React Native resolves packages from a flat node_modules layout;
# pnpm's isolated linker breaks Gradle autolinking without this.
nodeLinker: hoisted
# Refuse packages published in the last 7 days — supply-chain floor.
# The excludes below are the exact lockfile pins that were younger than
# the window when pinned (Expo SDK + evergreen data packages); any future
# bump must age past the window before it resolves.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/cli@57.0.26'
  - '@expo/router-server@57.0.10'
  - '@types/node@26.6.1'
  - babel-preset-expo@57.0.12
  - baseline-browser-mapping@2.11.25
  - brace-expansion@5.0.12
  - browserslist@4.29.0
  - electron-to-chromium@1.5.430
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.23
  - expo@57.0.24
  - http-cache-semantics@4.3.0
  - is-core-module@2.17.0
  - node-releases@2.0.56
allowBuilds:
  electron-winstaller: true
  esbuild: true
# @expo/metro exact-pins the metro family at 0.84.5 while react-native
# 0.86 resolves ^0.84.3 → 0.84.6 — remapping the fork onto 0.84.6
# collapses one whole ~6 MB metro tree per install. (The 0.87.1 tree
# is @react-native/metro-config's and can't merge into 0.84.)
overrides:
  # GHSA-ch52-4w7c-c8xp: 4.2.0 discloses cross-user cached responses via
  # max-stale. Transitive through electron-builder → @electron/get → got →
  # cacheable-request; 4.3.0 is inside its ^4.2.0 range.
  http-cache-semantics: '>=4.3.0'
  metro@0.84.5: 0.84.6
  metro-babel-transformer@0.84.5: 0.84.6
  metro-cache@0.84.5: 0.84.6
  metro-cache-key@0.84.5: 0.84.6
  metro-config@0.84.5: 0.84.6
  metro-core@0.84.5: 0.84.6
  metro-file-map@0.84.5: 0.84.6
  metro-minify-terser@0.84.5: 0.84.6
  metro-resolver@0.84.5: 0.84.6
  metro-runtime@0.84.5: 0.84.6
  metro-source-map@0.84.5: 0.84.6
  metro-symbolicate@0.84.5: 0.84.6
  metro-transform-plugins@0.84.5: 0.84.6
  metro-transform-worker@0.84.5: 0.84.6
