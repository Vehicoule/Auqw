[package]
name = "auqw-mobile-bindings"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "UniFFI bindings over the Auqw plugin host (Android + iOS)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# unsafe_code is inherent to the FFI scaffolding uniffi generates;
# the deny-by-default lint is not inherited here, same as the
# conformance guests that own the ABI boundary.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
auqw-host-surface = { path = "../host-surface" }
uniffi = { version = "0.32", features = ["cli"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
sha2 = "0.10.9"
wat = "1.259.0"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
