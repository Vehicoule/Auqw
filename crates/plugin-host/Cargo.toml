[package]
name = "auqw-plugin-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Wasmi host for Auqw provider plugins (ABI v0)"

[lints]
workspace = true

[dependencies]
wasmi = "2.0.0"
wasmparser = "0.259.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22.1"
thiserror = "2.0.18"
sha2 = "0.10.9"
futures-util = "0.3.31"

# reqwest 0.13 defaults to rustls-platform-verifier, which on Android
# requires a JNI Context a bare cdylib never receives; bundle the
# Mozilla roots instead (iOS takes the same path so mobile targets
# share one trust store). Versions must track reqwest's rustls line.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"

[dev-dependencies]
wat = "1.259.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time", "macros"] }
