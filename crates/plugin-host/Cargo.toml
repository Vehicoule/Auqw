[package]
name = "auqw-plugin-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Wasmi host for Auqw provider plugins (ABI v0)"

[lints]
workspace = true

[dependencies]
wasmi = "2.0.0"
wasmparser = "0.259.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22.1"
thiserror = "2.0.18"
sha2 = "0.10.9"
tracing = "0.1.44"
futures-util = "0.3.31"

[dev-dependencies]
wat = "1.259.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time", "macros"] }
