appId: com.vehicoule.auqw
productName: auqw
copyright: Copyright © 2026 Vehicoule

# electron-builder owns this output dir — `dist/` belongs to esbuild.
directories:
  output: dist-packages

# The packaged app is exactly the esbuild bundles + its own manifest —
# never src/, node_modules, or the cargo target tree.
files:
  - "dist/**/*"
  - "package.json"

# utilityProcess.fork resolves the entry by real path — a fork target
# must live outside app.asar. The napi binding ships outside it too
# (extraResources below).
asarUnpack:
  - "dist/utility/**"
  - "**/*.node"

# The napi cdylib name is per-OS (.so/.dylib/.dll) — the packaged
# utility host scans process.resourcesPath for auqw_node_bindings.node
# (see src/utility/host.ts bindingsCandidates), so each platform
# section ships its own artifact under the shared name. `plugins/` is
# the synced provider set (tooling/sync-plugins.mjs
# apps/desktop/plugins) — the fork env defaults AUQW_PLUGIN_DIR to it
# in packaged mode (src/main/index.ts utilityEnv).
extraResources:
  - from: plugins
    to: plugins

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  executableName: auqw
  # WM_CLASS tracks the .desktop filename so desktops associate the
  # running window with the entry (taskbar icon, rules).
  syncDesktopName: true
  category: Audio
  maintainer: Vehicoule
  target:
    - AppImage
    - flatpak
  extraResources:
    - from: ../../target/release/libauqw_node_bindings.so
      to: auqw_node_bindings.node
  desktop:
    entry:
      Name: auqw
      GenericName: Music Player
      Comment: Plugin-resolved audio client — sandboxed Wasm providers
      Categories: Audio;AudioVideo;Player;

# electron-builder defaults pin freedesktop 20.08, too old for Electron
# 44's glibc floor — 24.08 matches the current Electron2.BaseApp branch.
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"

# Unsigned alpha: adhoc-signed, no Apple notarization. macOS runners
# are arm64 — the artifacts are Apple-silicon only (Intel macs get no
# alpha build until a signing/universal decision). Gatekeeper flags
# the quarantine bit; `xattr -dr com.apple.quarantine` clears it.
mac:
  category: public.app-category.music
  target:
    - dmg
  extraResources:
    - from: ../../target/release/libauqw_node_bindings.dylib
      to: auqw_node_bindings.node

# Unsigned alpha: Windows SmartScreen flags the installer until a code
# certificate exists (same parked signing decision as macOS).
win:
  target:
    - nsis
  extraResources:
    - from: ../../target/release/auqw_node_bindings.dll
      to: auqw_node_bindings.node

# Assisted installer: alpha users should see the install-dir choice
# and per-user install (no admin) — oneClick's silent install hides it.
nsis:
  oneClick: false
  perMachine: false
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}
