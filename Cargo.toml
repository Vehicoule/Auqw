[workspace]
resolver = "2"
members = [
    "crates/auqw-stream",
    "crates/host-surface",
    "crates/integration-runner",
    "crates/mobile-bindings",
    "crates/plugin-host",
    "sdk/conformance/echo",
    "sdk/conformance/scenario",
    "sdk/conformance/spin",
    "sdk/rust",
]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
