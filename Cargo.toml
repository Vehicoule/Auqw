[workspace]
resolver = "2"
members = [
    "crates/auqw-stream",
    "crates/host-surface",
    "crates/integration-runner",
    "crates/mobile-bindings",
    "crates/node-bindings",
    "crates/plugin-host",
    "sdk/conformance/echo",
    "sdk/conformance/scenario",
    "sdk/conformance/spin",
    "sdk/rust",
]

# Wasmi executes guests far slower in debug than in any opt build —
# plugin-host and mobile-bindings tests burn fuel budgets and
# deadline/cancel loops through it. opt-level 1 recovers ~30x on those
# paths; do NOT raise it: at opt-level >= 2 the interpreter grows
# native frames enough that the scenario guest overflows a tokio
# worker's stack (repro: cargo test -p auqw-plugin-host --test
# scenario). Release builds run wasmi at opt3 regardless — this
# override only widens debug/test coverage of that risk, it does not
# create it.
[profile.dev.package.wasmi]
opt-level = 1
debug-assertions = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

# Release artifacts ship as FFI cdylibs inside the desktop package and
# the Android AAB — size is the constraint there. thin LTO +
# codegen-units=1 + strip take ~36% off each .so; panic=abort drops the
# landing pads the FFI boundary could never unwind across anyway.
# strip = "debuginfo" keeps the symbol table: uniffi-bindgen reads the
# UniFFI metadata out of .symtab, and "symbols" removes it entirely.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
opt-level = "z"
